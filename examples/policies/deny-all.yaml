# OpenShell 0.1.2 strict starting point; review paths for your workload.
# "deny-all" refers to agent egress, not filesystem access or service routing.
version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /bin
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /app
  read_write:
    - /workspace
    - /tmp
    - /dev/null
landlock:
  compatibility: hard_requirement
# The image must contain this non-root user and group.
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies: {}
