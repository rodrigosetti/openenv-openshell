# OpenShell 0.1.2 compatibility starting point for an image-baked policy.
# Based on the local EchoEnv probe fixture; not a least-privilege default.
version: 1
filesystem_policy:
  include_workdir: true
  read_only:
    - /bin
    - /usr
    - /lib
    - /proc
    - /dev/urandom
    - /etc
    - /var/log
    - /app
  read_write:
    - /tmp
    - /dev/null
landlock:
  compatibility: best_effort
network_policies: {}
