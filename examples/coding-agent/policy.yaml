# I8 coding-agent demo: deny-all.yaml's strict filesystem and identity posture,
# plus one package-index read. Everything else, including ~/.ssh, /host and
# arbitrary internet hosts, stays undeclared and therefore denied.
version: 1
filesystem_policy:
  include_workdir: false
  read_only:
    - /bin
    - /usr
    - /lib
    - /etc
    - /proc
    - /dev/urandom
    - /app
  read_write:
    - /workspace
    - /tmp
    - /dev/null
landlock:
  compatibility: hard_requirement
process:
  run_as_user: sandbox
  run_as_group: sandbox
network_policies:
  package-index-read:
    name: package-index-read
    binaries:
      - path: /usr/local/bin/python3.12
    endpoints:
      - host: pypi.org
        port: 443
        protocol: rest
        enforcement: enforce
        access: read_only
