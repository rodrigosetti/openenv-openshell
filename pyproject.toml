[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "openenv-openshell"
version = "0.1.0"
description = "Run OpenEnv environment servers in NVIDIA OpenShell sandboxes"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "OpenEnv OpenShell contributors" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx>=0.28,<0.29",
  "openenv==0.6.0",
  "pyyaml>=6.0.3,<7",
]

[project.urls]
Repository = "https://github.com/rodrigosetti/openenv-openshell"
Issues = "https://github.com/rodrigosetti/openenv-openshell/issues"
Documentation = "https://github.com/rodrigosetti/openenv-openshell#readme"
Changelog = "https://github.com/rodrigosetti/openenv-openshell/blob/main/docs/release-notes/0.1.0.md"

[dependency-groups]
dev = [
  "openshell @ https://github.com/NVIDIA/OpenShell/releases/download/v0.1.2/openshell-0.1.2-py3-none-any.whl#sha256=8c409da4f176d42418d92366fe201f47cceef2c0fa432bfbce2bf938649d59cf",
  "packaging>=25,<27",
  "twine>=7,<8",
  "hatchling>=1.27,<2",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.13,<0.15",
  "types-pyyaml>=6,<7",
]
docs = [
  "mkdocs>=1.6.1,<1.7",
]

# The official SDK is a separately installed runtime prerequisite (I13).
# Index metadata cannot contain direct references; dev retains the exact pin.

[tool.hatch.build.targets.sdist]
exclude = ["/.beads", "/.agents", "/.codex"]
include = [
  "src/openenv_openshell",
  "README.md",
  "LICENSE",
  "pyproject.toml",
  "requirements-openshell.txt",
  "uv.lock",
  "Makefile",
  "SPEC.md",
  "docs",
  "examples",
  "scripts",
  "tests",
]

[tool.hatch.build.targets.wheel]
packages = ["src/openenv_openshell"]

[tool.pyright]
include = ["src", "tests", "scripts", "examples", "docs/_hooks"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = [
  "--strict-config",
  "--strict-markers",
  "-m=not integration",
  "--cov=openenv_openshell",
  "--cov-branch",
  "--cov-report=term-missing:skip-covered",
  "--cov-fail-under=95",
]
testpaths = ["tests"]
markers = [
  "integration: requires a running OpenShell gateway and external resources",
]

[tool.coverage.run]
branch = true
source = ["openenv_openshell"]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812", # Conflicts with the formatter.
  "D203",   # Prefer no blank line before class docstrings.
  "D213",   # Prefer summary on the first docstring line.
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]
# Standalone demo scripts, not an importable package; progress goes to stdout.
"examples/*.py" = ["INP001", "T201"]

[tool.ruff.lint.isort]
known-first-party = ["openenv_openshell"]

[tool.ruff.format]
docstring-code-format = true
